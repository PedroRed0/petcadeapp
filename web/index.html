<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Substituído pelo valor de --base-href no `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PetCadê — juntos por eles. Encontre e ajude a encontrar animais perdidos.">
  <meta name="theme-color" content="#5B3FA3">

  <!-- iPhone: abre em tela cheia quando adicionado à Tela de Início -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PetCadê">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PetCadê</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Tela roxa com a logo enquanto o app carrega */
    html, body { margin: 0; height: 100%; background: #5B3FA3; }
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: rgba(255, 255, 255, .85); font-size: 15px;
    }
    #carregando img { width: 96px; height: 96px; }
  </style>
</head>
<body>
  <div id="carregando">
    <img src="icons/Icon-192.png" alt="PetCadê">
    <span>Carregando…</span>
  </div>
  <script>
    // Some com a tela de carregamento quando o Flutter desenhar o app.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
